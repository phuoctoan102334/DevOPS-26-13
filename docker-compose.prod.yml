# Stack PROD — deploy bang image DA PUSH len GHCR (stage DEPLOY cua Jenkinsfile).
# Khong build tu source (image:, khong build:) — chi pull ve va chay, dung nhu server that.
# Ten image: ghcr.io/<user>/studentmanager-<backend|frontend|database>:<tag>
#
# Chay tay (khong can Jenkins):
#   $env:IMAGE_NS = "ghcr.io/<user-dockerhub-cua-ban>"   # PowerShell
#   $env:IMAGE_TAG = "master"                            # hoac ten nhánh / sha12
#   docker compose -p studentmanager-prod -f docker-compose.prod.yml up -d
#
# Luu y:
#   - Dung volume/prefix rieng (studentmanager-prod) de khong cham cung docker-compose.yml
#     (build tu source). Chi chay 1 trong 2 luc mot thoi vi dung chung port 1433/8080/3000.
#   - Dat MSSQL_SA_PASSWORD truoc khi up (gia tri mac dinh chi danh cho lab local).

services:
  database:
    image: ${IMAGE_NS:?Hay set IMAGE_NS (vd ghcr.io/<user>)}/studentmanager-database:${IMAGE_TAG:-master}
    pull_policy: always # keo lai tu registry — chong truong hop tag bi ghi de
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-SA_Passw0rd1}"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "for p in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd; do if [ -x $$p ]; then $$p -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' >/dev/null 2>&1 && exit 0; $$p -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' >/dev/null 2>&1 && exit 0; exit 1; fi; done; timeout 1 bash -c 'exec 3<>/dev/tcp/localhost/1433' && exit 0; exit 1"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  backend:
    image: ${IMAGE_NS:?Hay set IMAGE_NS (vd ghcr.io/<user>)}/studentmanager-backend:${IMAGE_TAG:-master}
    pull_policy: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://database:1433;databaseName=school;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: "${MSSQL_SA_PASSWORD:-SA_Passw0rd1}"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${IMAGE_NS:?Hay set IMAGE_NS (vd ghcr.io/<user>)}/studentmanager-frontend:${IMAGE_TAG:-master}
    pull_policy: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqldata:
