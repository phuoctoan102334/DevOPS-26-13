# Stack TEST — chay dung 3 image VUA BUILD san (pull_policy: never), dung trong stage TEST
# cua Jenkinsfile truoc khi push len registry. Cong rieng 11433/18080/13000 de khong chan
# port cua stack deploy dang chay (1433/8080/3000). Duong dan image lay tu bien:
#   IMAGE_NS=ghcr.io/<user>  IMAGE_TAG=<branch>
# Chay tay:
#   IMAGE_NS=ghcr.io/<user> IMAGE_TAG=master docker compose -p sms-test -f docker-compose.test.yml up -d
#   bash scripts/smoke-test.sh http://localhost:13000
#   docker compose -p sms-test -f docker-compose.test.yml down -v

services:
  database:
    image: ${IMAGE_NS:?Hay set IMAGE_NS (vd ghcr.io/<user>)}/studentmanager-database:${IMAGE_TAG:?Hay set IMAGE_TAG (vd master)}
    pull_policy: never # dung dung image da build, KHONG keo lai tu registry
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-SA_Passw0rd1}"
    ports:
      - "${TEST_DB_PORT:-11433}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "for p in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd; do if [ -x $$p ]; then $$p -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' >/dev/null 2>&1 && exit 0; $$p -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' >/dev/null 2>&1 && exit 0; exit 1; fi; done; timeout 1 bash -c 'exec 3<>/dev/tcp/localhost/1433' && exit 0; exit 1"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 40s

  backend:
    image: ${IMAGE_NS:?Hay set IMAGE_NS (vd ghcr.io/<user>)}/studentmanager-backend:${IMAGE_TAG:?Hay set IMAGE_TAG (vd master)}
    pull_policy: never
    ports:
      - "${TEST_API_PORT:-18080}:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://database:1433;databaseName=school;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: "${MSSQL_SA_PASSWORD:-SA_Passw0rd1}"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: ${IMAGE_NS:?Hay set IMAGE_NS (vd ghcr.io/<user>)}/studentmanager-frontend:${IMAGE_TAG:?Hay set IMAGE_TAG (vd master)}
    pull_policy: never
    ports:
      - "${TEST_WEB_PORT:-13000}:80"
    depends_on:
      - backend

volumes:
  sqldata:
