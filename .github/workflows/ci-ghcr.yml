name: CI - Test, Build & Push GHCR

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  MSSQL_SA_PASSWORD: CI_Passw0rd1

jobs:
  test:
    name: Backend tests (Maven + SQL Server)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DB image & start SQL Server (tu tao school + bang students)
        run: |
          docker build -t sms-db:ci ./database
          docker run -d --name sqlserver -p 1433:1433 \
            -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="${MSSQL_SA_PASSWORD}" \
            sms-db:ci

      - name: Wait for SQL Server ready
        run: |
          ok=0
          for _ in $(seq 1 90); do
            if timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/1433' 2>/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::SQL Server khong mo duoc port 1433"
            exit 1
          fi
          sleep 20

      - name: Setup Java 21 + cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: "jdbc:sqlserver://localhost:1433;databaseName=school;trustServerCertificate=true"
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ${{ env.MSSQL_SA_PASSWORD }}
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Show SQL Server logs on failure
        if: failure()
        run: docker logs sqlserver 2>&1 | tail -n 100

  build-push:
    name: Build & push ${{ matrix.image }} -> GHCR
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
          - image: frontend
            context: ./frontend
          - image: database
            context: ./database
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image base (GHCR yeu cau lowercase)
        run: echo "IMAGE_BASE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
